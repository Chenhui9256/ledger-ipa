<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>裤样通 · 男裤逆向制版（一期原型）</title>
<style>
  :root{
    --bg:#111417; --card:#1b2026; --card2:#232a31; --line:#2f3841;
    --txt:#e8ecf0; --sub:#9aa7b4; --acc:#d94f3d; --acc2:#e0a13d; --ok:#3fae6a;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{background:#000; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--txt);}
  .app{max-width:430px; margin:0 auto; min-height:100vh; background:var(--bg); display:flex; flex-direction:column;}
  header{padding:16px 16px 10px; border-bottom:1px solid var(--line);}
  header h1{font-size:18px; font-weight:700;}
  header .sub{font-size:12px; color:var(--sub); margin-top:3px;}
  .tabs{display:flex; background:var(--card); border-bottom:1px solid var(--line);}
  .tabs button{flex:1; padding:11px 0; background:none; border:none; color:var(--sub); font-size:14px; font-weight:600;}
  .tabs button.on{color:var(--txt); box-shadow:inset 0 -2px 0 var(--acc);}
  main{flex:1; padding:14px 14px 30px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px;}
  .card h3{font-size:14px; margin-bottom:10px; color:var(--acc2);}
  .row{display:flex; align-items:center; margin-bottom:10px;}
  .row label{flex:1.2; font-size:13px; color:var(--txt);}
  .row .hint{display:block; font-size:11px; color:var(--sub); margin-top:2px;}
  .row input,.row select{flex:1; background:var(--card2); border:1px solid var(--line); color:var(--txt);
    border-radius:8px; padding:9px 10px; font-size:15px; text-align:right; max-width:130px;}
  .seg{display:flex; gap:8px; margin-bottom:6px;}
  .seg button{flex:1; padding:10px 0; border-radius:9px; border:1px solid var(--line); background:var(--card2); color:var(--sub); font-size:13px; font-weight:600;}
  .seg button.on{background:var(--acc); border-color:var(--acc); color:#fff;}
  .btn{width:100%; padding:13px; border:none; border-radius:10px; background:var(--acc); color:#fff; font-size:15px; font-weight:700; margin-top:6px;}
  .btn.gray{background:var(--card2); color:var(--txt); border:1px solid var(--line);}
  .btn.ok{background:var(--ok);}
  .res-t{width:100%; border-collapse:collapse; font-size:13px;}
  .res-t td{padding:8px 4px; border-bottom:1px solid var(--line);}
  .res-t td:first-child{color:var(--sub);}
  .res-t td:nth-child(2){text-align:right; font-weight:700; font-size:15px;}
  .res-t td:last-child{text-align:right; color:var(--sub); font-size:11px; max-width:130px;}
  .formula{display:none; background:var(--card2); border-radius:8px; padding:8px; margin:4px 0 10px; font-size:12px; color:var(--acc2); line-height:1.6;}
  .formula.show{display:block;}
  .banner{border-radius:10px; padding:11px 12px; font-size:13px; line-height:1.55; margin-bottom:12px;}
  .banner.ok{background:rgba(63,174,106,.14); border:1px solid rgba(63,174,106,.5); color:#7fd6a3;}
  .banner.warn{background:rgba(217,79,61,.14); border:1px solid rgba(217,79,61,.5); color:#f0a396;}
  .draw-wrap{overflow-x:auto; text-align:center;}
  .draw-wrap svg{display:block; margin:6px auto;}
  .legend{font-size:11px; color:var(--sub); line-height:1.7; margin-top:6px;}
  textarea{width:100%; min-height:320px; background:var(--card2); color:var(--txt); border:1px solid var(--line);
    border-radius:10px; padding:10px; font-size:12px; font-family:Menlo,monospace; line-height:1.5;}
  .note{font-size:12px; color:var(--sub); line-height:1.7;}
  .print-area{display:none;}
  .ppage{width:190mm; height:270mm; margin:10mm; overflow:hidden; position:relative; page-break-after:always;}
  .psvg{position:absolute;}
  .pmark{position:absolute; right:4mm; bottom:3mm; font-size:8mm; color:#333;}
  .cross{position:absolute; width:12mm; height:12mm;}
  .cross::before{content:""; position:absolute; left:50%; top:0; width:.3mm; height:12mm; background:#000;}
  .cross::after{content:""; position:absolute; top:50%; left:0; height:.3mm; width:12mm; background:#000;}
  @media print{
    @page{size:A4; margin:0;}
    body{background:#fff;}
    .app{display:none;}
    .print-area{display:block;}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>裤样通 · 男裤逆向制版</h1>
    <div class="sub">一期原型 · 国内中式基型 · 量成衣反推纸样</div>
  </header>
  <div class="tabs">
    <button data-t="in" class="on">① 录入</button>
    <button data-t="calc">② 反推</button>
    <button data-t="draw">③ 画板</button>
    <button data-t="print">④ 打印</button>
    <button data-t="fml">公式</button>
  </div>
  <main id="main"></main>
</div>
<div class="print-area" id="printArea"></div>

<script>
"use strict";
/* ============ 默认公式包（国内中式基型，全部系数可改） ============ */
const DEFAULT_PACK = {
  "缝缩损耗cm": { "腰围": 0.5, "臀围": 1.0 },
  "松量档": {
    "夏·薄料单层": { "直裆修正": -1.5, "总裆宽系数": 0.155, "膝围增量": 4 },
    "冬·厚料加绒": { "直裆修正": -1.0, "总裆宽系数": 0.16,  "膝围增量": 6 }
  },
  "前后裆宽比": { "前": 0.40, "后": 0.60 },
  "落裆cm": 1.0,
  "直裆公式2": "身高/10 + 臀制/10 + 2",
  "直裆公式3": "前裆拉链长 + 4.5",
  "后翘比(后裆宽/x)": 3.0,
  "后翘起翘上限cm": 3.0,
  "前褶cm": 2.5,
  "后省总cm": 5.0,
  "膝线距脚口": "下裆长/2 - 5",
  "闭合校验增量cm": 1.0,
  "闭合校验容差cm": 3.0
};

let pack = JSON.parse(localStorage.getItem("kyt_pack") || "null") || structuredClone(DEFAULT_PACK);
let meas = JSON.parse(localStorage.getItem("kyt_meas") || "null") || {
  L:"", I:"", W:"", H:"", TT:"", FW:"", SB:"", K:"", Z:"", Hgt:"", season:"夏"
};

/* ============ 反推计算引擎 ============ */
function compute(m, p){
  const r = { steps: [], warns: [], checks: [] };
  const num = v => (v !== "" && v != null && !isNaN(parseFloat(v))) ? parseFloat(v) : null;
  const L=num(m.L), I=num(m.I), W=num(m.W), H=num(m.H), TT=num(m.TT),
        FW=num(m.FW), SB=num(m.SB), K=num(m.K), Z=num(m.Z), Hgt=num(m.Hgt);
  r.missing = [];
  [ ["裤长",L],["下裆长",I],["腰围",W],["臀围",H],["脚口",SB] ].forEach(([k,v])=>{ if(v==null) r.missing.push(k); });
  if(r.missing.length){ return r; }

  const sp = p["松量档"][m.season] || p["松量档"]["夏·薄料单层"];
  // 1) 缝缩损耗：成品 -> 制版
  r.H制 = +(H - p["缝缩损耗cm"]["臀围"]).toFixed(1);
  r.W制 = +(W - p["缝缩损耗cm"]["腰围"]).toFixed(1);
  r.steps.push(["制版臀围", r.H制, "成品臀围 " + H + " − 缝缩 " + p["缝缩损耗cm"]["臀围"]]);
  r.steps.push(["制版腰围", r.W制, "成品腰围 " + W + " − 缝缩 " + p["缝缩损耗cm"]["腰围"]]);

  // 2) 直裆（上裆深）：多公式交叉
  const cands = [];
  cands.push({ v: r.H制/4 + sp["直裆修正"], src: "臀制/4 + (" + sp["直裆修正"] + ")  [" + m.season + "档]" });
  if(Hgt) cands.push({ v: Hgt/10 + r.H制/10 + 2, src: "身高/10 + 臀制/10 + 2" });
  if(Z)   cands.push({ v: Z + 4.5, src: "拉链长 " + Z + " + 4.5" });
  r.直裆候选 = cands.map(c => ({ v: +c.v.toFixed(1), src: c.src }));
  r.直裆 = +cands.reduce((s,c)=>s+c.v,0).div(cands.length).toFixed(1);
  r.steps.push(["直裆(上裆深)", r.直裆, "取 " + cands.length + " 个公式均值，见下方候选"]);

  // 3) 裆宽体系
  let ttSrc;
  if(TT != null){ r.总裆宽 = TT; ttSrc = "实测横裆宽"; }
  else { r.总裆宽 = +(r.H制 * sp["总裆宽系数"]).toFixed(1); ttSrc = "臀制×" + sp["总裆宽系数"] + "（" + m.season + "档）"; }
  if(FW != null){ r.前裆宽 = FW; r.后裆宽 = +(r.总裆宽 - FW).toFixed(1); r.steps.push(["前裆宽", r.前裆宽, "实测值"]); }
  else {
    r.前裆宽 = +(r.总裆宽 * p["前后裆宽比"]["前"]).toFixed(1);
    r.steps.push(["前裆宽", r.前裆宽, ttSrc + " × " + p["前后裆宽比"]["前"]]);
  }
  r.steps.push(["后裆宽", r.后裆宽 ?? +(r.总裆宽 * p["前后裆宽比"]["后"]).toFixed(1), "总裆宽 − 前裆宽"]);
  r.后裆宽 = r.后裆宽 ?? +(r.总裆宽 * p["前后裆宽比"]["后"]).toFixed(1);
  r.steps.push(["总裆宽(横裆)", r.总裆宽, ttSrc]);

  // 4) 前裆深 / 后翘 / 落裆
  r.前裆深 = +(r.直裆 - p["落裆cm"]).toFixed(1);
  r.后翘 = +(r.后裆宽 / p["后翘比(后裆宽/x)"]).toFixed(1);
  r.steps.push(["前裆深", r.前裆深, "直裆 − 落裆 " + p["落裆cm"]]);
  r.steps.push(["后翘(后腰起翘)", r.后翘, "后裆宽 ÷ " + p["后翘比(后裆宽/x)"]]);

  // 5) 中裆(膝)
  r.膝距脚口 = +(I/2 - 5).toFixed(1);
  r.膝围 = K != null ? K : +(SB + sp["膝围增量"]).toFixed(1);
  r.steps.push(["膝围线位置", r.膝距脚口, "距脚口 = 下裆长/2 − 5"]);
  r.steps.push(["中裆(膝围)", r.膝围, K != null ? "实测值" : "脚口 + " + sp["膝围增量"] + "（" + m.season + "档）"]);

  // 6) 省褶（腰臀差分配）
  r.腰臀差 = +(r.H制 - r.W制).toFixed(1);
  r.前褶 = p["前褶cm"]; r.后省总 = p["后省总cm"];
  r.steps.push(["腰臀差", r.腰臀差, "臀制 − 腰制，用于省褶分配"]);
  r.steps.push(["前褶量", r.前褶, "公式包设定"]);
  r.steps.push(["后省总量", r.后省总, "公式包设定"]);

  // 7) 几何闭合校验
  const pred = r.直裆 + I + p["闭合校验增量cm"];
  const diff = +(L - pred).toFixed(1);
  r.checks.push({
    name: "闭合校验：直裆 + 下裆长 ≈ 裤长",
    detail: r.直裆 + " + " + I + " + " + p["闭合校验增量cm"] + " = " + pred.toFixed(1) + "，实测裤长 " + L + "，差 " + diff,
    ok: Math.abs(diff) <= p["闭合校验容差cm"]
  });
  if(SB > r.H制/2 - 4) r.warns.push("脚口偏大（接近臀围一半），请确认量的是脚口围而不是裤口对折宽。");
  if(Math.abs(diff) > p["闭合校验容差cm"])
    r.warns.push("闭合校验超差 " + Math.abs(diff) + "cm：直裆推算与裤长/下裆长矛盾，优先复核下裆长与直裆候选值。");
  return r;
}
Number.prototype.div = function(n){ return this / n; };

/* ============ 纸样轮廓生成（单位 cm，viewBox 即 cm） ============ */
function frontPath(r, m){
  const A = r.H制/4 - 1, xc = (A + r.前裆宽)/2;
  const xw = r.W制/4 - 1 + 2*r.前褶;
  const kh = r.膝围/2 - 2, hh = r.脚口h = r.SB/2 - 2;
  const yD = r.直裆, yK = r.L - r.膝距脚口, yH = r.L;
  const z = r.Z ?? Math.max(yD*0.55, 12);
  const kneeS = xc + kh, kneeI = xc - kh, hemS = xc + hh, hemI = xc - hh;
  return {
    W: Math.max(A, xw) + 3, H: yH + 1,
    d: `M 0 0 L ${xw} 0
        C ${xw*0.6 + A*0.4} ${yD*0.35}, ${A} ${yD*0.6}, ${A} ${yD}
        L ${kneeS} ${yK} L ${hemS} ${yH} L ${hemI} ${yH} L ${kneeI} ${yK}
        C ${kneeI} ${yK - (yK-yD)*0.25}, ${r.前裆宽*0.85} ${yD}, ${r.前裆宽} ${yD}
        C ${r.前裆宽*0.45} ${yD}, 0 ${yD - (yD-z)*0.35}, 0 ${z}
        L 0 0 Z`,
    marks: [
      { t:"dash", x1:xc, y1:0.5, x2:xc, y2:yH, label:"烫迹线" },
      { t:"dash", x1:x_c2m(xc,1.2), y1:0, x2:x_c2m(xc,1.2), y2:3, label:"" },
      { t:"dash", x1:x_c2m(xc,-1.2), y1:0, x2:x_c2m(xc,-1.2), y2:3, label:"" }
    ],
    dims: [
      { x1:0, y1:yD-6, x2:r.前裆宽, y2:yD-6, label:"前裆宽 " + r.前裆宽 },
      { x1:-2, y1:0, x2:-2, y2:yD, label:"直裆 " + r.直裆, side:true }
    ],
    title: "前片"
  };
}
function x_c2m(v,d){ return +(v+d).toFixed(2); }
function backPath(r, m){
  const B = r.H制/4 + 1, xc = (B + r.后裆宽)/2;
  const t = r.后翘, v = Math.min(r.后翘, pack["后翘起翘上限cm"]);
  const xw = t + r.W制/4 + 1 + r.后省总;
  const kh = r.膝围/2 + 2, hh = r.SB/2 + 2;
  const yD = r.直裆 + pack["落裆cm"], yK = r.L - r.膝距脚口, yH = r.L;
  const kneeS = xc + kh, kneeI = xc - kh, hemS = xc + hh, hemI = xc - hh;
  return {
    W: Math.max(B, xw) + 3, H: yH + v + 1,
    d: `M ${t} ${-v}
        L ${xw} 0
        C ${xw*0.6 + B*0.4} ${yD*0.35}, ${B} ${yD*0.6}, ${B} ${yD}
        L ${kneeS} ${yK} L ${hemS} ${yH} L ${hemI} ${yH} L ${kneeI} ${yK}
        C ${kneeI} ${yK - (yK-yD)*0.25}, ${r.后裆宽*0.9} ${yD}, ${r.后裆宽} ${yD}
        L ${t} ${-v} Z`,
    marks: [
      { t:"dash", x1:xc, y1:0, x2:xc, y2:yH, label:"烫迹线" },
      { t:"dart", p1:[lerp(t,xw,0.35),0], p2:[lerp(t,xw,0.38),8.5], label:"省" },
      { t:"dart", p1:[lerp(t,xw,0.68),0], p2:[lerp(t,xw,0.66),8.5], label:"省" }
    ],
    dims: [
      { x1:t-1.5, y1:-v, x2:t-1.5, y2:yD, label:"后裆深 " + (r.直裆 + pack["落裆cm"]), side:true }
    ],
    title: "后片（含落裆 " + pack["落裆cm"] + " / 后翘 " + r.后翘 + "）"
  };
}
function lerp(a,b,t){ return +(a+(b-a)*t).toFixed(2); }

function pieceSVG(piece, px, forPrint){
  const sw = forPrint ? 0.12 : 0.18;
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 ${piece.title.startsWith("后") ? -6 : -4} ${piece.W+6} ${piece.H+8}"
      width="${Math.round((piece.W+6)*px)}" height="${Math.round((piece.H+8)*px)}">`;
  s += `<path d="${piece.d}" fill="none" stroke="#e8ecf0" stroke-width="${sw}"/>`;
  piece.marks.forEach(mk=>{
    if(mk.t==="dash")
      s += `<line x1="${mk.x1}" y1="${mk.y1}" x2="${mk.x2}" y2="${mk.y2}" stroke="#e0a13d" stroke-width="${sw*0.8}" stroke-dasharray="0.6 0.5"/>`;
    if(mk.t==="dart")
      s += `<line x1="${mk.p1[0]}" y1="${mk.p1[1]}" x2="${mk.p2[0]}" y2="${mk.p2[1]}" stroke="#9aa7b4" stroke-width="${sw*0.8}"/>`;
    if(mk.label) s += `<text x="${(mk.x1+mk.x2)/2}" y="${(mk.y1+mk.y2)/2}" font-size="0.9" fill="#e0a13d" text-anchor="middle">${mk.label}</text>`;
  });
  piece.dims.forEach(dm=>{
    s += `<line x1="${dm.x1}" y1="${dm.y1}" x2="${dm.x2}" y2="${dm.y2}" stroke="#d94f3d" stroke-width="${sw*0.8}"/>`;
    const tx = dm.x2 + (dm.side ? -0.8 : 0.8), anchor = dm.side ? "end" : "start";
    s += `<text x="${tx}" y="${(dm.y1+dm.y2)/2}" font-size="1.1" fill="#f0a396" text-anchor="${anchor}">${dm.label}</text>`;
  });
  s += `<text x="0" y="${piece.H+1}" font-size="1.6" fill="#e8ecf0" font-weight="bold">${piece.title}</text>`;
  return s + "</svg>";
}

/* ============ 界面渲染 ============ */
const main = document.getElementById("main");
let curTab = "in";
const $ = h => { const d=document.createElement("div"); d.innerHTML=h; return d.firstElementChild; };
const esc = s => String(s).replace(/</g,"&lt;");

function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on", b.dataset.t===curTab));
  const r = compute(meas, pack);
  main.innerHTML = "";
  if(curTab==="in") renderIn(r);
  if(curTab==="calc") renderCalc(r);
  if(curTab==="draw") renderDraw(r);
  if(curTab==="print") renderPrint(r);
  if(curTab==="fml") renderFml();
}
function bindInputs(container){
  container.querySelectorAll("input,select").forEach(el=>{
    el.addEventListener("input", ()=>{
      meas[el.dataset.k] = el.value;
      localStorage.setItem("kyt_meas", JSON.stringify(meas));
    });
    el.addEventListener("blur", render);
    el.addEventListener("change", ()=>{ meas[el.dataset.k]=el.value; localStorage.setItem("kyt_meas",JSON.stringify(meas)); render(); });
  });
}

function renderIn(r){
  const F = (k,label,hint,ph,unit) => `
    <div class="row"><label>${label}<span class="hint">${hint}</span></label>
      <input data-k="${k}" inputmode="decimal" placeholder="${ph||""}" value="${meas[k]??""}">${unit?"<span style='margin-left:6px;font-size:12px;color:var(--sub)'>"+unit+"</span>":""}</div>`;
  const box = $(`
  <div>
    <div class="card">
      <h3>款式档位</h3>
      <div class="seg">
        <button data-s="夏" class="${meas.season==="夏"?"on":""}">夏 · 薄料单层</button>
        <button data-s="冬" class="${meas.season==="冬"?"on":""}">冬 · 厚料加绒</button>
      </div>
      <div class="note">当前档位影响：直裆修正、总裆宽系数、膝围增量（系数在「公式」页可改）。</div>
    </div>
    <div class="card">
      <h3>必录 · 可直接量的尺寸（成品，cm）</h3>
      ${F("L","裤长","腰口量至脚口（不含腰头）")}
      ${F("I","下裆长","裆底十字位量至脚口")}
      ${F("W","腰围","腰头下沿水平围量一周")}
      ${F("H","臀围","横裆上方最丰满处围量一周")}
      ${F("SB","脚口","裤口围量一周")}
    </div>
    <div class="card">
      <h3>选录 · 有则更准（cm）</h3>
      ${F("TT","横裆宽(总裆宽)","十字裆位水平围量一周","")}
      ${F("FW","前裆宽","前片裆弯最宽处")}
      ${F("K","膝围","膝线位置围量一周")}
      ${F("Z","前裆拉链长","门襟拉链实际长度")}
      ${F("Hgt","穿着者身高","用于直裆交叉验证")}
    </div>
    ${r.missing && r.missing.length ? `<div class="banner warn">还差：${r.missing.join("、")}。填完必录项后到「② 反推」看结果。</div>`
      : `<div class="banner ok">必录项齐全，进入「② 反推」计算结构尺寸。</div>`}
  </div>`);
  box.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{
    meas.season=b.dataset.s; localStorage.setItem("kyt_meas",JSON.stringify(meas)); render();
  }));
  bindInputs(box);
  main.appendChild(box);
}

function renderCalc(r){
  if(!r.直裆){ main.appendChild($(`<div class="banner warn">必录项未填全：${r.missing.join("、")}。请先到「① 录入」。</div>`)); return; }
  const rows = r.steps.map(([n,v,src])=>`
    <tr class="frow" data-n="${esc(n)}"><td>${esc(n)}</td><td>${v} cm</td><td>${esc(src)}</td></tr>`).join("");
  const cands = r.直裆候选.map(c=>`<div>· ${c.v} cm　<span style="color:var(--sub)">${esc(c.src)}</span></div>`).join("");
  const checks = r.checks.map(c=>`<div class="banner ${c.ok?"ok":"warn"}"><b>${c.ok?"✓":"⚠"} ${esc(c.name)}</b><br>${esc(c.detail)}</div>`).join("");
  const warns = r.warns.map(w=>`<div class="banner warn">⚠ ${esc(w)}</div>`).join("");
  main.appendChild($(`
  <div>
    ${checks}${warns}
    <div class="card"><h3>反推结果（点击行看公式）</h3>
      <table class="res-t"><tbody>${rows}</tbody></table>
      <div class="formula" id="fmlD"><b>直裆多公式交叉：</b>${cands}<br>取均值可抵消单公式偏差；若候选间差值>2cm，优先怀疑测量。</div>
    </div>
    <div class="card"><h3>下一步</h3><button class="btn gray" id="goDraw">到「③ 画板」查看纸样 →</button></div>
  </div>`));
  main.querySelectorAll(".frow").forEach(tr=>tr.addEventListener("click",()=>{
    if(tr.dataset.n==="直裆(上裆深)") document.getElementById("fmlD").classList.toggle("show");
  }));
  document.getElementById("goDraw").addEventListener("click",()=>{ curTab="draw"; render(); });
}

function renderDraw(r){
  if(!r.直裆){ main.appendChild($(`<div class="banner warn">先在「① 录入」填全必录项。</div>`)); return; }
  r.SB = parseFloat(meas.SB); r.Z = parseFloat(meas.Z);
  const f = frontPath(r, meas), b = backPath(r, meas);
  const px = Math.min(11, 360/Math.max(f.W,b.W));
  main.appendChild($(`<div>
    <div class="card"><h3>结构画板（屏幕示意，非1:1）</h3>
      <div class="draw-wrap" id="dw"></div>
      <div class="legend">实线＝净缝轮廓 · 橙虚线＝烫迹线/褶位 · 红线＝关键推算尺寸标注 · 打印版请在「④ 打印」生成 1:1 分版。</div>
    </div></div>`));
  document.getElementById("dw").innerHTML = pieceSVG(f,px,false) + pieceSVG(b,px,false);
}

/* ---- 打印：1:1 A4 分版 ---- */
function renderPrint(r){
  if(!r.直裆){ main.appendChild($(`<div class="banner warn">先在「① 录入」填全必录项。</div>`)); return; }
  r.SB = parseFloat(meas.SB); r.Z = parseFloat(meas.Z);
  const f = frontPath(r, meas), b = backPath(r, meas);
  main.appendChild($(`<div>
    <div class="card"><h3>1:1 A4 分版打印</h3>
      <div class="note" style="margin-bottom:10px">按 A4（21×29.7cm）自动分版，每页留 1cm 拼接重叠与对位十字。生成后点「打印 / 存为 PDF」，打印机设置选<b>实际大小 100%</b>、边距无。前后片分开拼接。</div>
      <button class="btn ok" id="genP">生成 1:1 打印页</button>
      <div id="pinfo" class="note" style="margin-top:10px"></div>
    </div></div>`));
  document.getElementById("genP").addEventListener("click",()=>{
    const area = document.getElementById("printArea");
    area.innerHTML = "";
    const px = 37.795; // 1cm
    let pages = 0;
    [f,b].forEach(pc=>{
      const tileW=18, tileH=26, ov=1;
      const cols=Math.ceil(pc.W/tileW), rows=Math.ceil(pc.H/tileH);
      for(let ri=0;ri<rows;ri++) for(let ci=0;ci<cols;ci++){
        pages++;
        const pg=document.createElement("div"); pg.className="ppage";
        const svg = pieceSVG(pc, px, true);
        const holder=document.createElement("div"); holder.className="psvg";
        holder.style.left = (5 - ci*(tileW-ov)) + "mm";
        holder.style.top  = (5 - ri*(tileH-ov)) + "mm";
        holder.innerHTML = svg;
        // svg 尺寸用 mm 换算
        const sv=holder.firstElementChild; const cmW=pc.W+6, cmH=pc.H+8;
        sv.setAttribute("width", cmW*10+"mm"); sv.setAttribute("height", cmH*10+"mm");
        pg.appendChild(holder);
        [[0,0],[tileW,0],[0,tileH],[tileW,tileH]].forEach(([cx,cy])=>{
          const c=document.createElement("div"); c.className="cross";
          c.style.left=(cx-6)+"mm"; c.style.top=(cy-6)+"mm"; pg.appendChild(c);
        });
        const mk=document.createElement("div"); mk.className="pmark";
        mk.textContent = pc.title.slice(0,2) + ` 第${ri+1}行·第${ci+1}列（共${rows}行×${cols}列）`;
        pg.appendChild(mk);
        area.appendChild(pg);
      }
    });
    document.getElementById("pinfo").innerHTML = `已生成 <b>${pages}</b> 页（1:1）。点下方按钮调起系统打印（iPhone 可存为 PDF）：<button class="btn" id="doP" style="margin-top:10px">打印 / 存为 PDF</button>`;
    document.getElementById("doP").addEventListener("click",()=>window.print());
    render();
  });
}

function renderFml(){
  const box = $(`<div>
    <div class="card"><h3>公式包（JSON，改完点保存即时生效）</h3>
      <textarea id="fmlTA"></textarea>
      <button class="btn" id="saveP">保存公式包</button>
      <button class="btn gray" id="resetP">恢复默认</button>
      <div class="note" style="margin-top:8px">校准方法：拿已知标准纸样的裤子核对每个反推值，哪个偏了就改对应系数（如「直裆修正」「前后裆宽比」），公式包外置，后续款式扩展只加包不改代码。</div>
    </div></div>`);
  main.appendChild(box);
  const ta=box.querySelector("#fmlTA");
  ta.value = JSON.stringify(pack,null,2);
  box.querySelector("#saveP").addEventListener("click",()=>{
    try{ pack=JSON.parse(ta.value); localStorage.setItem("kyt_pack",JSON.stringify(pack)); alert("公式包已保存并生效"); render(); }
    catch(e){ alert("JSON 格式错误：" + e.message); }
  });
  box.querySelector("#resetP").addEventListener("click",()=>{
    pack=structuredClone(DEFAULT_PACK); localStorage.removeItem("kyt_pack"); render();
  });
}

document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{ curTab=b.dataset.t; render(); }));
render();
</script>
