name: Build 裤样通 IPA for TrollStore

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - name: Release embedded project files
        run: |
          mkdir -p "$(dirname project.yml)"
          base64 -d > project.yml <<'B64END'
          
          B64END
          echo "written project.yml: $(wc -c < project.yml) bytes"
          mkdir -p "$(dirname Info.plist)"
          base64 -d > Info.plist <<'B64END'
          
          B64END
          echo "written Info.plist: $(wc -c < Info.plist) bytes"
          mkdir -p "$(dirname entitlements.plist)"
          base64 -d > entitlements.plist <<'B64END'
          
          B64END
          echo "written entitlements.plist: $(wc -c < entitlements.plist) bytes"
          mkdir -p "$(dirname Sources/main.m)"
          base64 -d > Sources/main.m <<'B64END'
          I2ltcG9ydCA8VUlLaXQvVUlLaXQuaD4KI2ltcG9ydCAiQXBwRGVsZWdhdGUuaCIKCmludCBtYWluKGludCBhcmdjLCBjaGFyICogYXJndltdKSB7CiAgICBAYXV0b3JlbGVhc2Vwb29sIHsKICAgICAgICByZXR1cm4gVUlBcHBsaWNhdGlvbk1haW4oYXJnYywgYXJndiwgbmlsLCBOU1N0cmluZ0Zyb21DbGFzcyhbQXBwRGVsZWdhdGUgY2xhc3NdKSk7CiAgICB9Cn0K
          B64END
          echo "written Sources/main.m: $(wc -c < Sources/main.m) bytes"
          mkdir -p "$(dirname Sources/AppDelegate.h)"
          base64 -d > Sources/AppDelegate.h <<'B64END'
          I2ltcG9ydCA8VUlLaXQvVUlLaXQuaD4KCkBpbnRlcmZhY2UgQXBwRGVsZWdhdGUgOiBVSVJlc3BvbmRlciA8VUlBcHBsaWNhdGlvbkRlbGVnYXRlPgpAcHJvcGVydHkgKHN0cm9uZywgbm9uYXRvbWljKSBVSVdpbmRvdyAqd2luZG93OwpAZW5kCg==
          B64END
          echo "written Sources/AppDelegate.h: $(wc -c < Sources/AppDelegate.h) bytes"
          mkdir -p "$(dirname Sources/AppDelegate.m)"
          base64 -d > Sources/AppDelegate.m <<'B64END'
          
          B64END
          echo "written Sources/AppDelegate.m: $(wc -c < Sources/AppDelegate.m) bytes"
          mkdir -p "$(dirname Sources/ViewController.h)"
          base64 -d > Sources/ViewController.h <<'B64END'
          I2ltcG9ydCA8VUlLaXQvVUlLaXQuaD4KCkBpbnRlcmZhY2UgVmlld0NvbnRyb2xsZXIgOiBVSVZpZXdDb250cm9sbGVyCkBlbmQK
          B64END
          echo "written Sources/ViewController.h: $(wc -c < Sources/ViewController.h) bytes"
          mkdir -p "$(dirname Sources/ViewController.m)"
          base64 -d > Sources/ViewController.m <<'B64END'
          
          B64END
          echo "written Sources/ViewController.m: $(wc -c < Sources/ViewController.m) bytes"
          mkdir -p "$(dirname web/index.html)"
          base64 -d > web/index.html <<'B64END'
          
          B64END
          echo "written web/index.html: $(wc -c < web/index.html) bytes"
          mkdir -p "$(dirname assets/icon60.png)"
          base64 -d > assets/icon60.png <<'B64END'
          
          B64END
          echo "written assets/icon60.png: $(wc -c < assets/icon60.png) bytes"
          mkdir -p "$(dirname assets/icon120.png)"
          base64 -d > assets/icon120.png <<'B64END'
          
          B64END
          echo "written assets/icon120.png: $(wc -c < assets/icon120.png) bytes"
          mkdir -p "$(dirname assets/icon180.png)"
          base64 -d > assets/icon180.png <<'B64END'
          
          B64END
          echo "written assets/icon180.png: $(wc -c < assets/icon180.png) bytes"
      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild build \
            -project KuyangApp.xcodeproj \
            -scheme KuyangApp \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Ensure web asset, icon and final plist are inside app bundle
        run: |
          set -x
          APP="build/Build/Products/Release-iphoneos/KuyangApp.app"
          echo "APP=$APP"
          if [ ! -f "$APP/KuyangApp" ]; then echo "FATAL: main binary NOT FOUND"; ls -laR build 2>&1 | head -80; exit 1; fi
          file "$APP/KuyangApp" 2>&1 || true
          cp -f web/index.html "$APP/index.html"
          mkdir -p "$APP/web"
          cp -f web/index.html "$APP/web/index.html"
          cp -f assets/icon60.png "$APP/Icon.png"
          cp -f assets/icon120.png "$APP/Icon@2x.png"
          cp -f assets/icon180.png "$APP/Icon@3x.png"
          cp -f Info.plist "$APP/Info.plist"
          test -f "$APP/KuyangApp" || { echo "FATAL: main binary missing before packaging"; exit 1; }
          plutil -extract CFBundleExecutable raw "$APP/Info.plist" 2>&1 || true
          ls -la "$APP/index.html" "$APP/web/index.html" "$APP/Icon.png" "$APP/Info.plist" 2>&1 || true
          set +x

      - name: Ad-hoc self-sign (fakesign for TrollStore)
        run: |
          APP="build/Build/Products/Release-iphoneos/KuyangApp.app"
          if [ ! -f "$APP/KuyangApp" ]; then echo "FATAL: main binary NOT FOUND"; exit 1; fi
          file "$APP/KuyangApp" 2>&1 || true
          codesign --force --deep --sign - --entitlements entitlements.plist --generate-entitlement-der "$APP"
          echo "签名完成"
          codesign -d --entitlements :- "$APP" 2>&1 | head -20 || true

      - name: Verify app
        run: |
          APP="build/Build/Products/Release-iphoneos/KuyangApp.app"
          echo "========== INFO PLIST =========="
          plutil -p "$APP/Info.plist" 2>&1 | head -40 || true
          echo "========== SIGNATURE =========="
          codesign -dvvv "$APP" 2>&1 || true
          echo "========== VERIFY =========="
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 || true

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/KuyangApp.app"
          rm -rf Payload KuyangApp.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/KuyangApp.app
          if [ ! -f "Payload/KuyangApp.app/KuyangApp" ]; then echo "FATAL: main binary missing in Payload"; exit 1; fi
          file "Payload/KuyangApp.app/KuyangApp" 2>&1 || true
          zip -qry KuyangApp.ipa Payload
          echo "========== IPA STRUCTURE =========="
          unzip -l KuyangApp.ipa 2>&1 | head -40 || true
          echo "========== SIZE =========="
          ls -lh KuyangApp.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: KuyangApp-IPA
          path: KuyangApp.ipa
