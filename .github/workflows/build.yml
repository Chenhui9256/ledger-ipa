      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build app (unsigned)
        run: |
          xcodebuild build \
            -project LedgerApp.xcodeproj \
            -scheme LedgerApp \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO
      - name: Ensure web asset, icon and final plist are inside app bundle
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "LedgerApp.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then echo "APP NOT FOUND"; exit 1; fi
          cp web/index.html "$APP/index.html"
          mkdir -p "$APP/web"
          cp web/index.html "$APP/web/index.html"
          cp assets/icon60.png  "$APP/Icon.png"
          cp assets/icon120.png "$APP/Icon@2x.png"
          cp assets/icon180.png "$APP/Icon@3x.png"
          cp Info.plist "$APP/Info.plist"
          echo "========== BUNDLE ASSETS =========="
          ls -la "$APP/index.html" "$APP/Icon.png" "$APP/Icon@2x.png" "$APP/Icon@3x.png" "$APP/Info.plist"
          echo "========== FINAL NAMES =========="
          plutil -extract CFBundleDisplayName raw "$APP/Info.plist"
          plutil -extract CFBundleName raw "$APP/Info.plist"
      - name: Ad-hoc self-sign (fakesign for TrollStore)
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "LedgerApp.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then echo "APP NOT FOUND"; exit 1; fi
          codesign --force --deep --sign - --entitlements entitlements.plist --generate-entitlement-der "$APP"
          echo "签名完成"
          codesign -d --entitlements :- "$APP" 2>&1 | head -20 || true
      - name: Verify app and print diagnostics
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "LedgerApp.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then echo "APP NOT FOUND"; exit 1; fi
          echo "========== APP PATH =========="
          echo "$APP"
          echo "========== Info.plist FINAL =========="
          plutil -p "$APP/Info.plist"
          echo "========== APP CONTENTS =========="
          ls -la "$APP"
          echo "========== EXECUTABLE =========="
          file "$APP/LedgerApp" 2>&1 || true
          echo "========== SIGNATURE =========="
          codesign -dvvv "$APP" 2>&1 || true
          echo "========== VERIFY =========="
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 || true
          echo "========== WEB FILE =========="
          ls -la "$APP/index.html" "$APP/web/index.html" 2>&1 || true
          echo "========== DIAGNOSTICS END =========="
      - name: Package IPA
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "LedgerApp.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then echo "APP NOT FOUND"; exit 1; fi
          rm -rf Payload LedgerApp-v2.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/LedgerApp.app
          zip -qry LedgerApp-v2.ipa Payload
          echo "========== IPA STRUCTURE =========="
          unzip -l LedgerApp-v2.ipa | head -40
          echo "========== SIZE =========="
          ls -la LedgerApp-v2.ipa
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LedgerApp-IPA-v2
          path: LedgerApp-v2.ipa
