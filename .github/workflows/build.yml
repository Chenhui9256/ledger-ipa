      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build app (unsigned)
        run: |
          xcodebuild build \
            -project LedgerApp.xcodeproj \
            -scheme LedgerApp \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO
      - name: Package IPA
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "LedgerApp.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then echo "APP NOT FOUND"; exit 1; fi
          mkdir -p Payload
          cp -r "$APP" Payload/LedgerApp.app
          zip -qry LedgerApp.ipa Payload
          ls -la LedgerApp.ipa
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LedgerApp-IPA
          path: LedgerApp.ipa
